[package]
name = "dshf_unified_core"
version = "6.2.0"
edition = "2021"
authors = ["Architect"]
description = "Grand Unified DSHF Architecture: Self-Ingesting, Autonomous Thinking, Phase-Locked Hyper-Graph."

[dependencies]
num-complex = { version = "0.4.6", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rustfft = "6.2.0"
ratatui = "0.26.2"
crossterm = "0.27.0"
rand = "0.8.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true